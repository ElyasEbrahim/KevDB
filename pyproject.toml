[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kevdb"
version = "0.2.0"
description = "Semantic SQL in DuckDB powered by open-source decision models, benchmarked against the Jev API and generative LLMs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ElyasEbrahim" }]
requires-python = ">=3.12"
keywords = ["decision models", "semantic SQL", "DuckDB", "entity matching", "open-source models"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27", "duckdb>=1.5", "pyarrow>=25", "numpy>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Analysis scripts in experiments/ and the scripts bundled with SemBench.
# The exact versions used for the published results are pinned in experiments/database/requirements.txt.
# The experiment scripts were run on DuckDB 1.5 and are not changed for DuckDB 2.0, which keeps an unread execute()
# result open and blocks the next query; the kevdb package itself works with both.
experiments = ["duckdb>=1.5,<2", "pandas>=3", "scipy>=1.18", "scikit-learn>=1.9", "matplotlib>=3.11"]
# experiments/query_plan/ talks to PostgreSQL.
query_plan = ["psycopg[binary]>=3.2"]

[project.urls]
Homepage = "https://github.com/ElyasEbrahim/KevDB"
Issues = "https://github.com/ElyasEbrahim/KevDB/issues"

[project.scripts]
kevdb = "kevdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
